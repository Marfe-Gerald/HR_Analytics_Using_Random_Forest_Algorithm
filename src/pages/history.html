<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History Screen | HR Analytics</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/history.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <div class="content">
    <header class="page-header">
      <p class="eyebrow">Screen</p>
      <h1>History Screen</h1>
      <p>Previously entered inputs.</p>
    </header>
    <main>
      <section class="card">
        <h2>Saved Inputs <span class="badge" style="margin-left:auto">Placeholder</span></h2>
        <div class="toolbar">
          <span class="muted">Most recent first (up to 50 entries).</span>
          <button type="button" class="btn ghost" id="clear-history">Clear History</button>
        </div>
        <div id="history-wrap"></div>
      </section>
    </main>
    <footer>HR Analytics &bull; Random Forest &bull; ML Website Project</footer>
  </div>
</div>
<script src="js/main.js"></script>
<script src="js/history.js"></script>
</body>
</html>
