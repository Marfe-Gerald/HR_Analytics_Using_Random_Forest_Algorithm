<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Result Screen | HR Analytics</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/result.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <div class="content">
    <header class="page-header">
      <p class="eyebrow">Screen</p>
      <h1>Result Screen</h1>
      <p>Prediction output and the inputs that produced it.</p>
    </header>
    <main>
      <div class="grid">
        <section class="card">
          <h2>Prediction Result</h2>
          <div class="prediction"><div class="label">Predicted Output</div><div class="value" id="prediction-value">&mdash;</div><span class="badge">Placeholder</span></div>
        </section>
        <section class="card">
          <h2>Submitted Inputs</h2>
          <div id="inputs"></div>
        </section>
      </div>
      <section class="card">
        <h2>Model Performance</h2>
        <div class="grid">
          <div class="metric"><div class="label">RMSE</div><div class="value">&mdash;</div><span class="badge">Under Construction</span></div>
          <div class="metric"><div class="label">R&sup2; Score</div><div class="value">&mdash;</div><span class="badge">Under Construction</span></div>
        </div>
      </section>
    </main>
    <footer>HR Analytics &bull; Random Forest &bull; ML Website Project</footer>
  </div>
</div>
<script src="js/main.js"></script>
<script src="js/result.js"></script>
</body>
</html>
